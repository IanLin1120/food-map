<body>
<div id="app">
  <section class="page on" id="pgMap">
    <div id="map"></div>
    <div class="mapTop">
      <div class="mTopRow"><div id="mSearch" class="glass">
        <input id="mQ" type="search" placeholder="搜尋店家、地址…" autocomplete="off" enterkeyhint="search">
        <button class="ic" id="mQx" aria-label="清除" style="display:none">✕</button>
        <button class="ic" id="mQgo" aria-label="搜尋">🔍</button>
      </div><button id="favBtn" class="glass" aria-label="收藏"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-3.8-5.5 3.8z"/></svg><span>收藏</span><em id="favBadge"></em></button></div>
      <div id="mResults" class="card hide"></div>
      <div id="chips" class="noSel"></div>
      <div id="areaBar"><select id="arC" class="glass" aria-label="縣市"></select><select id="arT" class="glass" aria-label="鄉鎮市區"></select><button class="ic glass" id="arMe" aria-label="我所在的鄉鎮市區">📍</button><button class="ic glass hide" id="arX" aria-label="取消區域">✕</button></div>
    </div>
    <div class="mapFabs" id="mapFabs">
      <button class="fab glass" id="fb3d" aria-label="切換 2D／3D">3D</button>
      <button class="fab glass" id="fbN" aria-label="轉回北方朝上"><svg viewBox="0 0 24 24"><path d="M12 3l4 9H8z" fill="currentColor"/><path d="M12 21l-4-9h8z"/></svg></button>
      <button class="fab glass" id="fbMe" aria-label="我的位置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      <button class="fab glass big" id="fbAdd" aria-label="新增收藏地點">＋</button>
    </div>
    <div id="mCard"></div>
  </section>

  <section class="page" id="pgFav">
    <div class="pgHead"><button class="favBack" id="favBack" aria-label="回地圖"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="grow"><h1 id="favTitle">收藏分類</h1><div class="sub" id="favSub"></div></div><div class="phBtns"><button class="btn sm foldAll" id="favFold">全部收合</button><button class="btn sm" id="favCats">管理分類</button></div></div>
    <div class="pgBody"><div class="pgInner">
      <div class="searchBox" style="margin-bottom:.9rem"><input id="favQ" type="search" placeholder="搜尋店名、地址、菜單品項…"></div>
      <div id="favList" class="noSel"></div>
    </div></div>
  </section>

  <section class="page" id="pgInv">
    <div class="pgHead two"><div class="phRow"><h1>發票</h1><div class="sub" id="invSub"></div></div><div class="pgTools"><button class="btn pri" id="invScan">📷 掃描</button><button class="btn" id="invShot">🖼️ 截圖</button><button class="btn" id="invAcc">🤖 協助工具</button></div><div class="pgTools"><button class="btn" id="invMore">📥 其他匯入</button><button class="btn" id="invFind">🔍 搜尋</button><button class="btn" id="invSet">⚙️ 設定</button></div><div id="invJobs" hidden></div></div>
    <div class="pgBody"><div class="pgInner" id="invBody"></div></div>
  </section>

  <section class="page" id="pgShop">
    <div class="pgHead two"><div class="phRow"><h1>購物分帳</h1><div class="sub" id="shopSub"></div></div><div class="shopAdd top"><button class="btn pri" id="shopNewImg">📷 上傳明細</button><button class="btn" id="shopNewMan">✏️ 手動輸入</button></div><div class="pgTools"><button class="btn" id="shopFind" aria-label="搜尋紀錄">🔍 搜尋</button><button class="btn" id="shopToday">📅 今天</button><button class="btn" id="shopSet" aria-label="設定">⚙️ 設定</button></div><div id="shopJobs" hidden></div></div>
    <div class="pgBody"><div class="pgInner" id="shopBody"></div></div>
  </section>

  <section class="page" id="pgMeal">
    <div class="pgHead two"><div class="phRow"><h1>今天的安排</h1><div class="sub" id="mealSub"></div></div><div class="shopAdd top"><button class="btn pri" id="mealAddBtn">🍱 記一餐</button><button class="btn" id="listAddBtn">🛒 購物清單</button></div><div class="pgTools"><button class="btn" id="mealFind" aria-label="搜尋紀錄">🔍 搜尋</button><button class="btn" id="mealToday">📅 今天</button><button class="btn" id="mealSet" aria-label="設定">⚙️ 設定</button></div></div>
    <div class="pgBody"><div class="pgInner" id="mealBody"></div></div>
  </section>

  <section class="page" id="pgRec">
    <div class="pgHead"><button class="favBack" id="recBack" aria-label="回設定"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="grow"><h1>我的食譜</h1><div class="sub" id="recSub"></div></div><div class="phBtns"><button class="btn sm" id="recAI">✨ 圖片匯入</button><button class="btn sm pri" id="recAdd">＋ 新增</button></div></div>
    <div class="pgBody"><div class="pgInner">
      <div class="row" style="margin-bottom:.9rem"><div class="searchBox grow"><input id="recQ" type="search" placeholder="搜尋食譜、食材…"></div><button class="btn sm foldAll" id="recFold">全部收合</button><button class="btn sm" id="recCats">🗂️ 分類</button></div>
      <div id="recList" class="noSel"></div>
    </div></div>
  </section>

  <section class="page" id="pgAcc">
    <div class="pgHead two"><div class="phRow"><h1>記帳</h1><div class="sub" id="accSub"></div></div><div class="shopAdd top"><button class="btn pri" id="accNew">＋ 記一筆</button><button class="btn" id="accImp">📥 從分帳匯入</button></div><div class="pgTools"><button class="btn" id="accFind">🔍 搜尋</button><button class="btn" id="accTr">🔄 轉帳</button><button class="btn" id="accSettle">🤝 對帳</button></div></div>
    <div class="pgBody"><div class="pgInner" id="accBody"></div></div>
  </section>
  <section class="page" id="pgAccA">
    <div class="pgHead"><div class="grow"><h1>資產</h1><div class="sub" id="accASub"></div></div><button class="eyeBtn" id="accEye" aria-label="顯示金額"></button></div>
    <div class="pgBody"><div class="pgInner" id="accABody"></div></div>
  </section>
  <section class="page" id="pgAccS">
    <div class="pgHead"><div class="grow"><h1>消費分析</h1><div class="sub" id="accSSub"></div></div></div>
    <div class="pgBody"><div class="pgInner" id="accSBody"></div></div>
  </section>
  <section class="page" id="pgAccC">
    <div class="pgHead"><div class="grow"><h1>記帳設定</h1><div class="sub">分類、帳戶、匯出、雲端備份</div></div></div>
    <div class="pgBody"><div class="pgInner" id="accCBody"></div></div>
  </section>

  <section class="page" id="pgSet">
    <div class="pgHead"><div class="grow"><h1>設定</h1><div class="sub">日日帳本 · 美食、日常、購物分帳與發票</div></div></div>
    <div class="pgBody"><div class="pgInner" id="setBody"></div></div>
  </section>

  <nav id="tabbar">
    <button data-tab="Map" class="on"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>地圖</button>
    <button data-tab="Meal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M8 14.5l2.4 2.3L16 12.5"/></svg>日常</button>
    <button data-tab="Shop"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>分帳</button>
    <button data-tab="Inv"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8"/><path d="M8 15h2M12 15h1M15 15h1M8 17.5h1M11 17.5h2M15 17.5h1"/></svg>發票</button>
    <button data-tab="Set"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>設定</button>
  <button data-tab="Acc" class="accT"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 3.5v17M11.5 8h5M11.5 12h5"/></svg>記帳</button>
    <button data-tab="AccA" class="accT"><svg viewBox="0 0 24 24"><path d="M3.5 9.5 12 4l8.5 5.5M5.5 10v8M10 10v8M14 10v8M18.5 10v8M3.5 20h17"/></svg>資產</button>
    <button data-tab="AccS" class="accT"><svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12z"/><path d="M15 3.8A8.5 8.5 0 0 1 20.2 9H15z"/></svg>分析</button>
    <button data-tab="AccC" class="accT"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>設定</button>

  </nav>
</div>
<div id="viewer"><div class="vTop"><button class="ic" id="vX">✕</button><b class="grow" id="vT"></b><span id="vN" style="opacity:.85;font-size:.9rem"></span></div><div id="vScroll"><img id="vImg" alt=""></div><div class="vBot"><button class="btn" id="vPrev">‹ 上一張</button><button class="btn" id="vZo">－</button><button class="btn" id="vZi">＋</button><button class="btn" id="vNext">下一張 ›</button></div></div>
<div id="busy"><div class="box"><div class="spin"></div><div id="busyT"></div></div></div>
<div id="toast"></div>
<input type="file" id="filePick" accept="image/*" multiple class="hide">
<input type="file" id="invShotPick" accept="image/*" multiple class="hide">
<input type="file" id="csvPick" accept=".csv,.txt,text/csv,text/plain,text/comma-separated-values,application/vnd.ms-excel" class="hide">
<input type="file" id="jsonPick" accept=".json,application/json" class="hide">
</body>
